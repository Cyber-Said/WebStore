version: "3.9"

services:
  db:
    image: postgres:16
    container_name: webstore_db
    environment:
      POSTGRES_DB: webstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: webstore_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
